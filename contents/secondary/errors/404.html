<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>404 Not Found</title>
	<style>:root{--bg:#f6f7f9;--text:#16181d;--muted:#5b6170;--accent:#2f5bea;color-scheme:light}@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--text:#e7e9ee;--muted:#9aa1b1;--accent:#7f9dff;color-scheme:dark}}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,sans-serif;padding:16px;box-sizing:border-box}main{max-width:34rem}p.tag{margin:0;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.06em}h1{margin:4px 0;font:700 4rem ui-monospace,Menlo,monospace}code{font-family:ui-monospace,Menlo,monospace;font-size:.9em}a{color:var(--accent)}</style>
</head>
<body>
	<main>
		<p class="tag">Secondary custom 404</p>
		<h1>404</h1>
		<p>This is website 2's own error page, <code>./contents/secondary/errors/404.html</code>. Website 1 on port 8080 uses a different one.</p>
		<p><a href="/">Back to website 2</a></p>
	</main>
</body>
</html>
